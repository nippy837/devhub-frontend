limit_req_zone $binary_remote_addr zone=speed_rate:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=speed_connections:1m;

server {
    listen 80;
    server_name _;

    # 前端打包后的网页文件所在目录
    root /usr/share/nginx/html;
    index index.html;

    # /api/ 开头的请求转发给后端
    location /api/ {
        # backend 是后面 Docker Compose 中定义的后端服务名
        # 地址末尾不加 /，保留请求路径中的 /api/
        proxy_pass http://backend:8080;
        proxy_read_timeout 75s;

        # 将原始访问域名、客户端 IP 和协议传给后端
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /speed/ {
        limit_req zone=speed_rate burst=40 nodelay;
        limit_req_status 429;
        limit_conn speed_connections 3;
        limit_conn_status 429;
        client_max_body_size 20m;
        client_body_timeout 20s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_pass http://127.0.0.1:9020;
    }

    location / {
        # 优先返回实际文件；路径不存在时返回首页，支持前端路由刷新
        try_files $uri $uri/ /index.html;
    }
}
