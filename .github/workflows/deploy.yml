name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_ARCHIVE: frontend-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz

    steps:
      - name: 获取本次提交的代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 构建网页并打包
        run: |
          set -euo pipefail

          # 执行原 Dockerfile 的 build 阶段，生成 dist
          docker build --target build -t devhub-frontend-builder .

          # 创建一个不启动的临时容器，从中取出网页文件
          docker create --name frontend-export devhub-frontend-builder
          mkdir -p deploy-package
          docker cp frontend-export:/app/dist deploy-package/dist
          docker rm frontend-export

          # 部署包只包含网页、Nginx 配置和运行用的 Dockerfile
          cp nginx.conf deploy-package/nginx.conf
          cp deploy/Dockerfile deploy-package/Dockerfile
          tar -czf "$DEPLOY_ARCHIVE" -C deploy-package .

          # 打印部署包大小，方便了解实际上传量
          ls -lh "$DEPLOY_ARCHIVE"

      - name: 配置 SSH 登录凭据
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: 上传网页部署包
        run: |
          # 显示传输字节数、百分比和速度
          rsync --partial --info=progress2 \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3" \
            "$DEPLOY_ARCHIVE" \
            "$SSH_USER@$SSH_HOST:/home/ubuntu/projects/devhub/"

      - name: 更新前端并检查页面
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$GITHUB_SHA" "$DEPLOY_ARCHIVE" <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/projects/devhub

          version="$1"
          archive="$2"

          # 与后端共用部署锁，避免同时更新容器
          exec 9>.deploy.lock
          flock -w 300 9

          # 将本次部署文件解压到独立目录
          release="releases/${archive%.tar.gz}"
          mkdir -p "$release"
          tar -xzf "$archive" -C "$release"

          # 用现成的网页文件构建镜像，复用服务器上的 Nginx 层
          docker build -t "devhub-frontend:$version" "$release"
          rm -f "$archive"

          # 保留上一个版本，供需要时恢复
          if docker image inspect devhub-frontend:latest >/dev/null 2>&1; then
            docker tag devhub-frontend:latest devhub-frontend:previous
          fi

          docker tag "devhub-frontend:$version" devhub-frontend:latest

          # 更新前端，不重新构建或重启后端
          docker compose up -d --no-deps --no-build frontend

          # 检查网页是否能正常响应
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 10 \
            http://127.0.0.1/ -o /dev/null

          echo "前端部署成功"
          REMOTE